apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubepay
  namespace: payments
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubepay
  template:
    metadata:
      labels:
        app: kubepay
    spec:
      containers:
      - command:
        - python
        - /app/server.py
        env:
        - name: PYTHONDONTWRITEBYTECODE
          value: '1'
        image: python:3.12-alpine
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        name: kubepay
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          limits:
            cpu: 250m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /app
          name: code
          readOnly: true
      nodeSelector:
        workload: payments
      securityContext:
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - configMap:
          name: kubepay-code
        name: code

apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    release: monitoring
  name: kubepay
  namespace: monitoring
spec:
  endpoints:
  - interval: 15s
    path: /metrics
    port: http
    scrapeTimeout: 5s
  namespaceSelector:
    matchNames:
    - payments
  selector:
    matchLabels:
      app: kubepay
